[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taranis"
version = "0.1.0"
description = "Spectral RMHD solver in JAX"
dependencies = [
    "jax",
    "jaxlib",
    "orbax-checkpoint",
    "numpy",
    "tensorstore",
    "etils[epath]",
]

[project.optional-dependencies]
# Needed only for a real multi-rank launch (comm_backend="mpi4jax"/"jax"); a
# single-process run works serially without it (comm_backend="serial",
# auto-selected when these are absent). See CLAUDE.md's comms-backends bullet
# list and docs/SAVIO_CPU_SETUP.md/docs/SAVIO_GPU_SETUP.md (which build these
# from source by hand instead of via this extra, to pin the cluster MPI/ABI).
mpi = ["mpi4py", "mpi4jax"]
examples = ["matplotlib"]
test = ["pytest>=7", "matplotlib"]
lint = ["ruff==0.16.1"]

[tool.setuptools]
# NB: taranis.physics must be listed -- an install without it ships a package
# that cannot import its own equation registry (editable installs mask this).
packages = ["taranis", "taranis.physics", "taranis.diagnostics", "taranis.particles"]

[tool.ruff]
# Rule scope is PINNED deliberately, and so is the ruff version (see the `lint`
# extra above). Ruff's *default* ruleset widens between releases -- 0.16 both
# started linting notebooks and pulled in whole opinionated families (C408, UP,
# PL, SIM, ...), which would have turned 19 real findings into 237. Widening is a
# decision to make on purpose, not one to inherit from an upgrade.
#
# F = pyflakes: unused imports, undefined names, redefinitions. Error-class only,
# no style opinions. Adding "I" (import sorting) later is a one-line change plus a
# single mechanical `ruff check --fix` commit.
target-version = "py310"
extend-exclude = [
    # Notebooks legitimately carry imports for cells not yet written; holding
    # exploratory examples to package standards fights how they are used.
    "*.ipynb",
    "examples",
    "data",
    "rundir",
    "a5k",
]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "examples", "bench", "slurms", "rundir", "a5k", "docs", ".git"]
# Default local run = fast tier. An explicit -m on the command line overrides this.
addopts = "-ra -m 'not mpi and not slow and not savio'"
markers = [
    "mpi: needs a real multi-rank MPI launch (mpirun); skipped when size==1",
    "savio: needs cluster resources (multi-GPU / long wall clock); set RMHD_SAVIO=1",
    "slow: minutes-scale convergence or physics study; pass --runslow",
    "fp32: requires a TARANIS_PRECISION=32 session",
    "fp64: requires a TARANIS_PRECISION=64 session",
    "multidev: requires >=4 (fake or real) XLA devices",
]
