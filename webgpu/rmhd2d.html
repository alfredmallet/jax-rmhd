// ---------------------------------------------------------------------------
// controls: this page's spec for common.js's controlsBuild (REFINE_PLAN H.0).
// Only the genuinely 2D-specific bits are here; everything else is a shared
// fragment. Built at script-eval time, before anything reads a control.
// ---------------------------------------------------------------------------
// Box shapes (REFINE_PLAN J.2). nx comes from the resolution select; ny and both box
// lengths come from here, so "resolution" keeps meaning n_x. Rectangular boxes are what
// the equilibrium demos need: a long x to hold the layer's far field inside the periodic
// box, a short y carrying one unstable wavelength. (fy must keep ny a power of two --
// the FFT is radix-2 -- which 1, 1/4 and 4 all do at every offered resolution: selRes is
// 128 / 256 / 512, so `tall` resolves 512 / 1024 / 2048 in y.)
// `big` (TEARNL Phase 2) is not a new SHAPE -- it is the square box four times bigger, and
// what it buys is a small a / L_x: ONE layer with many unstable wavelengths along it, so
// the equilibrium selects its own k_y out of a broadband seed instead of being handed one.
// L_y = 8pi carries six of them; L_x = 8pi is what holds the islands.
//
// It arrived at 2pi x 8pi, went to 4pi x 8pi and then to this, both times because Alfred
// ran it and the islands did not fit: their extent ACROSS the sheet grows with their
// wavelength ALONG it, and coalescence keeps doubling that wavelength, so the last merger
// is much wider than the first. Separatrices reaching the periodic x boundary both look
// wrong and invalidate the far field Delta' is defined against. L_x/a is now 53.3, from
// 13.3. Raising eta to buy the resolution back at 512^2 instead was tried on paper and is
// worse: it takes 5x the resistivity to reach the benchmark and drops S to 91, which stops
// the mergers being the clean reconnection the preset is about.
//
// The price is POINTS and only points -- 1024^2 = 1.05 Mpts, which is exactly the 3D app's
// own default grid (128^2 x 64), Alfred's stated ceiling for this. Workgroup storage does
// NOT move: the longest transform line was already n_y = 1024 in the 4pi x 8pi version, so
// this is the same 16 KiB. Cells are isotropic by construction (fy = 1), which the payload
// requires -- the Sweet-Parker sheets between merging islands lie normal to y.
const BOXES = {
  sq:   { t: "square 2&pi; &times; 2&pi;", fy: 1, Lx: 2 * Math.PI, Ly: 2 * Math.PI },
  wide: { t: "wide 4&pi; &times; 2&pi;", fy: 1 / 4, Lx: 4 * Math.PI, Ly: 2 * Math.PI },
  big:  { t: "large 8&pi; &times; 8&pi;", fy: 1, Lx: 8 * Math.PI, Ly: 8 * Math.PI }
};
const boxOf = () => BOXES[el("selBox").value] || BOXES.sq;

controlsBuild({
  groups: [
    { id: "grpSim", summary: "simulation", rows: [
      [{ k: "lab", t: "resolution n<sub>x</sub>" },
       // 1024 is offered ONLY because `big` needs it, and costs no workgroup storage to
       // offer: the longest line is 1024 points either way (16 KiB, the guaranteed
       // minimum). It is 1.05 Mpts, so it is the slow end deliberately, and resSyncBox
       // disables it on any box whose n_y would then exceed NMAX_LINE.
       { k: "sel", id: "selRes", o: [[128, "128"], [256, "256"], [512, "512"], [1024, "1024"]], v: 256 },
       { k: "lab", t: "box" },
       { k: "sel", id: "selBox", o: Object.keys(BOXES).map(k => [k, BOXES[k].t]),
         ti: "perpendicular box shape; n_y and L_y follow it" },
       { k: "val", id: "vBox" }].concat(CTRL_SEED),
      CTRL_CFL
    ] },
    { id: "grpDiss", summary: "dissipation", rows: [ctrlDissRow(-13, { pm: true })] },
    CTRL_GRP_FORCE,
    ctrlGrpIC({ letters: "letters A / B", amp: 0, pre: CTRL_ROWS_EQ,
                presets: [["kh", "Kelvin–Helmholtz shear layers"],
                          ["tearing", "tearing mode"]] }),
    ctrlGrpDisp()
  ]
});

// makeGrid / buildShaders / Solver: solver2d.js (loaded above, loadable by a second page)

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
// Pm = nu/eta, from its box: a non-negative finite number (0 = inviscid phi), 1 (the
// scalar-dissipation path) on anything else. A compile-time constant of the stage
// kernel, hence a rebuild knob.
function uiPm() {
  const v = parseFloat(el("nPm").value);
  return (isFinite(v) && v >= 0) ? v : 1;
}
// The longest 1D transform line the app will build, in POINTS. The row/column FFT keeps a
// whole complex line in workgroup storage -- 2N vec2<f32> after the radix-2 padding, i.e.
// 16N bytes -- so 1024 points is 16 KiB, exactly `maxComputeWorkgroupStorageSize`'s
// guaranteed minimum. SPEC.md called 1024 "not offered" for that reason until TEARNL
// needed the tall box; what changed is that this page now ASKS the adapter for its own
// (invariably larger) limit, so the guaranteed minimum is a floor we sit on rather than a
// ceiling we sit under -- see initGPU({maxLimits}) at the boot call and SPEC.md 8. 2048
// would be 32 KiB, which is past the minimum, so the cap is a real one and is enforced
// here rather than trusted to the box table: `tall` is fy = 4, so selRes 512 would ask for
// it and the pipeline would simply fail to create.
const NMAX_LINE = 1024;
function uiParams() {
  const eps = uiEps(), b = boxOf();
  // clamp n_x, never n_y: dropping n_y alone would silently shear the cells, and for
  // `tall` in particular anisotropic cells leave the nonlinear Sweet-Parker sheets (which
  // lie normal to y) unresolved -- the one thing that box exists to avoid. Capping n_x
  // instead keeps dx = dy and costs only the resolution the device could not have run.
  const sel = parseInt(el("selRes").value, 10);
  const nx = Math.min(sel, Math.max(32, Math.floor(NMAX_LINE / Math.max(1, b.fy))));
  return {
    nx: nx, ny: Math.max(32, Math.round(nx * b.fy)),
    Lx: b.Lx, Ly: b.Ly,
    diss: Math.pow(10, parseFloat(el("rDiss").value)),
    hyper: parseInt(el("selHyper").value, 10), pm: uiPm(), eqsrc: icEqSrcOn(),
    epsP: eps[0], epsM: eps[1],
    tau: parseFloat(el("rTau").value),
    cfl: parseFloat(el("rCfl").value),
    fshell: uiFshell(), smax: 1e4,
    seed: parseInt(el("nSeed").value, 10) | 0
  };
}
// display cards get an aspect-correct canvas (REFINE_PLAN J.2): equal pixels per unit
// LENGTH on both axes, so contours and arrows are not sheared. The longer physical axis
// gets the historical 512 px, and a square box reproduces 512x512 exactly.
function cardAspect() {
  const q = liveParams(), r = q.Lx / q.Ly;
  return r >= 1 ? { w: 512, h: Math.max(64, Math.round(512 / r)) }
                : { w: Math.max(64, Math.round(512 * r)), h: 512 };
}
// Resolutions this box cannot run are DISABLED rather than silently clamped: the tall box
// is fy = 4, so selRes 512 would want a 2048-point transform line, past NMAX_LINE. The
// idiom is icSyncRows' hyper lock -- disable the control, say why in its title, and move
// the value to the nearest legal one -- because a readout saying "512, but actually 256"
// is a control lying about itself. uiParams still clamps: this is the UI half of one rule,
// not the rule.
// As of the 8pi x 8pi box this DISABLES NOTHING -- every entry in BOXES has fy <= 1, so
// n_y never exceeds n_x <= NMAX_LINE. It is kept because the rule is about the box table
// and not about today's contents: the 4pi x 8pi box this replaced had fy = 2 and did trip
// it, and the next long-y box would too. Do not delete it as unreachable.
function resSyncBox() {
  const b = boxOf(), sel = el("selRes"), cap = Math.floor(NMAX_LINE / Math.max(1, b.fy));
  let best = null;
  for (const o of sel.options) {
    const v = parseInt(o.value, 10);
    o.disabled = v > cap;
    if (!o.disabled && (best === null || v > best)) best = v;
  }
  sel.title = best !== null && best < 512
    ? "this box is " + b.fy + "× longer in y, so n_x above " + best + " would need a "
      + "transform line longer than " + NMAX_LINE + " points (the app's limit)"
    : "";
  // a disabled option can still be the SELECTED one (a preset wrote it, or the box changed
  // under it), which no amount of styling makes legible -- move the value instead
  if (best !== null && parseInt(sel.value, 10) > cap) sel.value = String(best);
}
// the 2D-only readouts: the resolved box, and the equilibrium-preset knobs
function syncLabels() {
  syncCommonLabels();
  resSyncBox();
  const q = uiParams();
  el("vBox").textContent = q.nx + "×" + q.ny;
  syncEqLabels();
}

// ---------------------------------------------------------------------------
// initial-condition presets
// ---------------------------------------------------------------------------
// A preset is a UI concept only: the solver knows the built-in pair (setIC / setIC(true))
// and "here is a real-space (phi, psi)" (setICFromReal). "letters" and "custom" both go
// through common.js's icPresetFields: one glyph (or the drawing) per Elsasser POTENTIAL
// zeta+-, each normalized at apply time so that max |zhat x grad zeta+-| is its own
// amplitude slider, then phi = (zeta+ + zeta-)/2, psi = (zeta+ - zeta-)/2.
function syncIC() { icSyncRows(); }
// (re)apply the current preset to the live solver and restart the traces
function applyIC() {
  if (!solver) return;
  // the maintained-flux source is a compile-time constant of nlAssemble (J2.3), so
  // switching IC preset into or out of the equilibrium that owns it is a REBUILD (which
  // ends by calling this again, now in step)
  if (!!solver.p.eqsrc !== uiParams().eqsrc) { rebuild(); return; }
  const q = solver.p, preset = el("selIC").value, amp = uiAmp();
  if (preset === "quiescent") solver.setIC(true);
  else if (preset === "modes") solver.setIC();
  else {
    const f = icPresetFields(q, preset, amp[0], amp[1], null);
    solver.setICFromReal(f.phi, f.psi);
  }
  spsSmooth = 0;
  chartsReset();
}

// knobs. In 2D there is no z, so it needs no plane slider and no extra IC rows.
function wireDrawEditor() {
  icDrawWire({
    params: () => solver && solver.p,
    target: () => el("selPaint").value,
    neg: () => el("cbNeg").checked,
    sliders: ["rSigP"]
  });
}

function rebuild() {
  // never destroy in an event handler: the frame loop may be awaiting a readback
  // on the old solver's buffers. Retire it and free it at the top of a later frame.
  if (solver) { graveyard.push(solver); solver = null; }
  // a new grid means a new (empty) drawing: the editor's arrays are per-resolution
  if (icDraw.on) icEditLeave("save");
  solver = new Solver(device, uiParams());
  cardsSync();
  stepsPerFrame = 1;
  applyIC();                 // the constructor's built-in IC, replaced by the preset
}

// slider / select -> live solver parameters (also used by the "auto" diss button)
function applyControls() {
  syncLabels();
  if (!solver) return;
  const q = uiParams();
  solver.p.diss = q.diss; solver.p.epsP = q.epsP; solver.p.epsM = q.epsM;
  solver.p.tau = q.tau; solver.p.cfl = q.cfl;
  solver.refreshDissipation(q.diss, q.hyper);
  solver.uploadCfg();
}

// ---------------------------------------------------------------------------
// bench (?bench): this page's kernel, FFT and per-step lists
// ---------------------------------------------------------------------------
// The pipelines, bind groups and dispatch shapes are the SOLVER's own -- encodeRHS and
// step() are the source, so a cell runs the shipped kernel over the shipped buffers at
// the shape the step gives it. `bufs` is each FFT kernel's binding order, which the
// bench needs because a ladder variant's `auto` layout is its own.
//
// `grads` is the gradient chain the hash cell runs and the buffer it reads back: the
// chain is encoded from this list's own cells, so it is the RHS's dispatches.
//
// `stepIO` is the step's dispatch list with the bytes each dispatch moves, in
// FFTPERF_PLAN appendix A's terms: cx = one complex field, rx = one real field, gr = one
// grid buffer (gridA and gridB are one each), and a transform of b lanes reads and writes
// b of them per pass. A buffer a kernel both reads and writes is counted twice. It is
// summed by benchStepIO into the record's bytes-per-step (and, through `bf`, its
// butterflies); the CFL reduction and the per-step scalar kernels are not in the list.
function benchSpec2D(s) {
  s = s || solver;
  const g = s.g, nx = g.nx, ny = g.ny, nky = g.nky, nm = g.nm, nr = s.nr;
  const B = s.buf, P = s.pl, G = s.bg;
  const cx = nm * 8, rx = nr * 4, gr = nm * 16, bl = benchLineBf;
  const rowsC2RGrads = { name: "rowsC2R", key: "rowsC2R", lanes: 8, pipe: P.rowsC2R,
    bg: G.rowsC2RGrads, bufs: [B.specTmp, B.realGrads], d: [8 * nx] };
  const colsInvGrads = { name: "colsInv", key: "colsInv", lanes: 8, pipe: P.colsInv,
    bg: G.colsInvGrads, bufs: [B.gradsK, B.specTmp], d: [8 * nky] };
  const prepGrads = { name: "prepGrads", pipe: P.prepGrads, bg: G.prepGrads,
    d: [Math.ceil(nm / 64)] };
  const ffts = [
    rowsC2RGrads, colsInvGrads,
    { name: "rowsR2C", key: "rowsR2C", lanes: 2, pipe: P.rowsR2C, bg: G.rowsR2CNL,
      bufs: [B.realNL, B.specTmp], d: [2 * nx] },
    { name: "colsFwd", key: "colsFwd", lanes: 2, pipe: P.colsFwd, bg: G.colsFwdNL,
      bufs: [B.specTmp, B.nlk], d: [2 * nky] }
  ];
  return {
    res: [nx, ny, 1], g: g, build: buildShaders, ffts: ffts,
    // the gradient chain, out of the same cells: encodeRHS's first three dispatches, and
    // the eight real-space lanes they leave in realGrads
    grads: { buf: B.realGrads, lanes: 8, bytes: rx,
             encode: p => { for (const c of [prepGrads, colsInvGrads, rowsC2RGrads]) benchDispatch(p, c); } },
    kernels: ffts.concat([
      prepGrads,
      { name: "bracket", pipe: P.bracket, bg: G.bracket, d: [Math.ceil(nr / 64)] },
      { name: "nlAssemble", pipe: P.nlAssemble, bg: G.nlAssemble, d: [Math.ceil(nm / 64)] },
      { name: "stage", pipe: P.stage, bg: G.stage[0], d: [Math.ceil(2 * nm / 64)] }
    ]),
    stepIO: [
      { name: "prepGrads", n: 3, bytes: 2 * cx + gr + 8 * cx },
      { name: "colsInv:8", n: 3, bytes: 8 * (2 * cx), bf: 8 * nky * bl(nx) },
      { name: "rowsC2R:8", n: 3, bytes: 8 * (cx + rx), bf: 8 * nx * bl(ny) },
      { name: "bracket", n: 3, bytes: 10 * rx },
      { name: "rowsR2C:2", n: 3, bytes: 2 * (rx + cx), bf: 2 * nx * bl(ny) },
      { name: "colsFwd:2", n: 3, bytes: 2 * (2 * cx), bf: 2 * nky * bl(nx) },
      // the maintained-flux equilibrium (J2.3) is a fifth binding of nlAssemble: one
      // more complex field read, and only when the preset asks for it
      { name: "nlAssemble", n: 3, bytes: 2 * cx + 2 * gr + 2 * cx + (s.p.eqsrc ? cx : 0) },
      { name: "forcingAdd", n: 3, bytes: 2 * cx + 2 * cx + 2 * cx },
      { name: "stage", n: 3, bytes: 10 * cx + gr },
      { name: "energyPartial", n: 1, bytes: 2 * cx + 2 * gr }
    ]
  };
}

async function runSelfTest() {
  const R = REFVEC, rows = [];
  const nm = R.nx * (R.ny / 2 + 1);
  const s = new Solver(device, {
    nx: R.nx, ny: R.ny, Lx: R.Lx, Ly: R.Ly, diss: R.diss, hyper: R.hyper,
    epsP: R.forcing_power_elsasser[0], epsM: R.forcing_power_elsasser[1],
    tau: R.forcing_tau, fshell: R.fshell, cfl: R.cfl_safety,
    smax: R.forcing_scale_max, seed: 12345
  });
  const d = device, B = s.buf;

  // --- static grid arrays ---------------------------------------------------
  const dealias = new Float32Array(nm), linL = new Float32Array(nm), fmask = new Float32Array(nm);
  for (let m = 0; m < nm; m++) { dealias[m] = s.g.gridB[4 * m]; linL[m] = s.g.gridB[4 * m + 1]; fmask[m] = s.g.gridB[4 * m + 2]; }
  rows.push(testRow("dealias mask", relL2(dealias, flatR(R.dealias)), 1e-5));
  rows.push(testRow("forcing shell mask", relL2(fmask, flatR(R.fmask)), 1e-5));
  rows.push(testRow("lin_L = -diss*ksq^hyper", relL2(linL, flatR(R.lin_L)), 1e-5));

  // the one-lane nonlinear-term transform chain, on any solver: the recorded 32^2 rows
  // and the analytic rows at the page's own resolution encode the same two passes
  const fftEnc = sv => ({
    fwd: p => {
      p.setPipeline(sv.pl.rowsR2C); p.setBindGroup(0, sv.bg.rowsR2CNL); p.dispatchWorkgroups(sv.g.nx);
      p.setPipeline(sv.pl.colsFwd); p.setBindGroup(0, sv.bg.colsFwdNL); p.dispatchWorkgroups(sv.g.nky);
    },
    inv: p => {
      p.setPipeline(sv.pl.colsInv); p.setBindGroup(0, sv.bg.colsInvNL); p.dispatchWorkgroups(sv.g.nky);
      p.setPipeline(sv.pl.rowsC2R); p.setBindGroup(0, sv.bg.rowsC2RNL); p.dispatchWorkgroups(sv.g.nx);
    }
  });

  // --- forward rfft2 + roundtrip -------------------------------------------
  {
    const inR = flatR(R.fft_input);
    const pad = new Float32Array(2 * s.nr); pad.set(inR);
    d.queue.writeBuffer(B.realNL, 0, pad);
    let enc = d.createCommandEncoder();
    let p = enc.beginComputePass();
    fftEnc(s).fwd(p);
    p.end(); d.queue.submit([enc.finish()]);
    const got = (await readBuf(d, B.nlk, nm * 8));
    rows.push(testRow("forward rfft2 (32x32)", relL2(got, flatC(R.fft_output)), 1e-5));
    // roundtrip
    enc = d.createCommandEncoder(); p = enc.beginComputePass();
    fftEnc(s).inv(p);
    p.end(); d.queue.submit([enc.finish()]);
    const back = (await readBuf(d, B.realNL, s.nr * 4)).subarray(0, s.nr);
    rows.push(testRow("rfft2 -> irfft2 roundtrip", relL2(back, inR), 1e-5));
  }

  // --- the same two transforms at the page's selected resolution ------------
  // Runs on the live solver; realNL / nlk are RHS scratch, rewritten by the next step.
  {
    const sv = solver;
    if (sv) for (const r of await fftAnalyticRows(sv, fftEnc(sv))) rows.push(r);
  }

  // --- initial condition (forward FFT + dealias) ----------------------------
  s.setIC();
  {
    const got = await readBuf(d, B.fields, 2 * nm * 8);
    rows.push(testRow("initial condition (k-space)", relL2(got, flatC(R.ic_fields_k)), 1e-5, "context"));
  }

  // --- load state A ---------------------------------------------------------
  const scal = new Float32Array(8);
  const loadA = () => {
    d.queue.writeBuffer(B.fields, 0, flatC(R.A_fields_k));
    d.queue.writeBuffer(B.forcing, 0, flatC(R.A_forcing_state));
    scal[4] = R.A_forcing_scale[0]; scal[5] = R.A_forcing_scale[1];
    scal[1] = R.A_t;
    d.queue.writeBuffer(B.scalars, 0, scal);
  };
  loadA();

  // --- nonlinear term at A --------------------------------------------------
  {
    const enc = d.createCommandEncoder();
    const p = enc.beginComputePass();
    s.encodeRHS(p, { cfl: true, forcing: false });
    p.end(); d.queue.submit([enc.finish()]);
    const got = await readBuf(d, B.rhs, 2 * nm * 8);
    rows.push(testRow("nonlinear term at A", relL2(got, flatC(R.A_nonlinear_k)), 1e-4));
    const sc = await readBuf(d, B.scalars, 32);
    rows.push(testRow("CFL dt at A", Math.abs(sc[0] - R.A_dt) / Math.abs(R.A_dt), 1e-5,
      "dt = " + sc[0].toPrecision(8)));
  }

  // --- forcing term at A (recorded scales) ----------------------------------
  {
    const enc = d.createCommandEncoder();
    enc.clearBuffer(B.rhs);
    const p = enc.beginComputePass();
    p.setPipeline(s.pl.forcingAdd); p.setBindGroup(0, s.bg.forcingAdd);
    p.dispatchWorkgroups(Math.ceil(nm / 64));
    p.end(); d.queue.submit([enc.finish()]);
    const got = await readBuf(d, B.rhs, 2 * nm * 8);
    rows.push(testRow("forcing term at A", relL2(got, flatC(R.A_forcing_term_k)), 1e-4));
  }

  // --- recomputed normalization scale + energy at A -------------------------
  // A_scale_check is jax's forcing_scale at A with the dt of the step that PRODUCED A
  // (A_dt_last), which is what run._advance_forcing used, so it reproduces
  // A_forcing_scale. The kernel reads its dt from sc[0], so put that same dt there --
  // the CFL block above left the NEXT step's dt (A_dt) in it.
  {
    scal[0] = R.A_dt_last;
    d.queue.writeBuffer(B.scalars, 0, scal);
    const enc = d.createCommandEncoder();
    const p = enc.beginComputePass();
    p.setPipeline(s.pl.scale); p.setBindGroup(0, s.bg.scale); p.dispatchWorkgroups(1);
    p.setPipeline(s.pl.energyPartial); p.setBindGroup(0, s.bg.energyPartial); p.dispatchWorkgroups(s.nPartM);
    p.setPipeline(s.pl.energyFinal); p.setBindGroup(0, s.bg.energyFinal); p.dispatchWorkgroups(1);
    p.end(); d.queue.submit([enc.finish()]);
    const sc = await readBuf(d, B.scalars, 32);
    rows.push(testRow("forcing scale s+- at A",
      relL2(new Float32Array([sc[4], sc[5]]), Float32Array.from(R.A_scale_check)), 1e-4));
    rows.push(testRow("energy (Ekin, Emag) at A",
      relL2(new Float32Array([sc[2], sc[3]]), Float32Array.from(R.A_energy)), 1e-5));
  }

  // --- one LSRK33 step from A with dt = A_dt, recorded scales, no OU --------
  {
    loadA();
    scal[0] = R.A_dt;
    d.queue.writeBuffer(B.scalars, 0, scal);
    const enc = d.createCommandEncoder();
    enc.clearBuffer(B.delta);
    s.encodeStep(enc, false);   // dt_override: no CFL recompute
    d.queue.submit([enc.finish()]);
    const got = await readBuf(d, B.fields, 2 * nm * 8);
    rows.push(testRow("one LSRK33 step A -> B", relL2(got, flatC(R.B_fields_k)), 5e-4));
  }

  // --- statistical OU / injection-rate check --------------------------------
  showTests(rows, "<div class='hint'>running statistical forcing check&hellip;</div>");
  await new Promise(r => setTimeout(r, 0));
  rows.push(await ouInjectionRow(s));
  showTests(rows);
  s.destroy();
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
async function boot() {
  // the shared chrome first (tabs + what-is rail): it has to be on the page even when
  // initGPU is about to fail, since the no-GPU path opens the rail's panes
  chromeBuild({ is3d: false });
  groupsInit();
  // sigma sliders take their range and default from the shared IC constants, BEFORE a
  // preset gets a chance to set them (REFINE_PLAN G.2)
  icSigmaSliderInit("rSigP", IC_SIGMA_PERP_FRAC, 0.25);
  // the preset (dropdown default, or ?demo=NAME as a deep link) rewrites the controls
  // and runs its "auto" prep BEFORE the first rebuild, so the solver is constructed
  // with its grid and dissipation. Done ahead of initGPU so the hint is on the page
  // even where WebGPU is missing.
  const pre = presetBoot(PRESETS);
  // maxLimits since TEARNL: the `tall` box's 1024-point y line wants 16 KiB of workgroup
  // storage, which is exactly the guaranteed minimum. NMAX_LINE caps the grid so every
  // offered configuration still fits a DEFAULT device -- this only buys margin.
  if (!await initGPU({ maxLimits: true })) return;

  cardsInit({
    fields: DISP_FIELDS,
    zslice: false,                  // no z axis in 2D
    nz: () => 1,
    zsliceOf: () => 0,
    offset: true,                   // the periodic x/y display offset (buildShaders: `shift`)
    aspect: cardAspect,             // rectangular boxes get rectangular cards (J.2)
    onLayout: syncLabels
  });
  // wire first: bootApply's syncIC asks the editor config which rows a preset owns
  wireCommonControls({ presets: PRESETS, rebuildOn: ["selBox", "nPm", "cbEqSrc"],
                       icSliders: EQ_SLIDERS });
  bootApply(pre);
  // ?bench only; a no-op without it
  benchBuild({ page: "rmhd2d", spec: benchSpec2D, applyIC: applyIC });
  loop();
}
boot();
</script>
