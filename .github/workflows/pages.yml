# GitHub Pages deploy -- webgpu/ only.
#
# The branch-based Pages pipeline tarballed the ENTIRE repo (466 MB, 452 of it
# examples/) and published it all, notebooks included; on 2026-08-06 its final
# deploy step started timing out at the 10-minute cap two runs in a row (build
# and artifact upload fine, content unchanged in size -- GitHub-side flakiness,
# but one we're exposed to only because the artifact is huge). This workflow
# uploads webgpu/ alone (~1.5 MB), so deploys take seconds and the rest of the
# repo is no longer served publicly. The staging step then prunes the dev-only
# files inside webgpu/ (devtools/ and its node_modules, __pycache__, the
# generators and their refvector JSONs, README/SPEC); the plan documents that
# used to sit alongside them are in plans-webgpu/ at the repo root, deliberately
# outside the copied directory.
#
# The artifact stages webgpu/ under a webgpu/ subdirectory, so the site lives
# at alfredmallet.github.io/taranis/webgpu/..., and a root index.html redirects
# the bare /taranis/ to it. NB: GitHub Pages URLs do NOT redirect across the
# jax_rmhd->taranis repo rename, so external links from
# alfredmallet.wordpress.com that point at /jax_rmhd/... are dead until updated
# there.
#
# ONE-TIME MANUAL STEP: repo Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions" (replacing "Deploy from a branch"). Until that is
# flipped, this workflow deploys AND the old branch pipeline keeps running;
# after it, the branch pipeline stops. Trigger is main only (work branches
# gdi_v2/precision merged 2026-08; removed 2026-08-08). NOTE: each branch
# listed here must ALSO be allowed in the github-pages deployment environment
# (Settings -> Environments -> github-pages -> Deployment branches), or the
# deploy step is rejected.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "webgpu/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (webgpu/ under its historical path + root redirect)
        run: |
          mkdir -p _site/webgpu
          cp -r webgpu/. _site/webgpu/
          # Drop the dev-only files the wholesale copy picks up. Copy-then-remove
          # rather than an allowlist ON PURPOSE: a new site file added to webgpu/
          # must publish by default, because the failure mode of an allowlist is a
          # 404 on the deployed page while file:// still works locally (devtools/
          # README, "uncommitted file" note). devtools/ is the bulk of it -- 4.1 MB
          # of node_modules against a ~1.5 MB site. The plan documents used to be
          # here too and are now in plans-webgpu/, one level up, out of reach of
          # this copy entirely.
          rm -rf _site/webgpu/devtools _site/webgpu/__pycache__
          rm -f  _site/webgpu/*.py _site/webgpu/refvectors.json \
                 _site/webgpu/refvectors3d.json \
                 _site/webgpu/README.md _site/webgpu/SPEC.md _site/webgpu/SPEC3D.md
          # game.html (GAME_PLAN) is local-only until it ships.
          rm -f  _site/webgpu/game.html
          # Fail loudly if the pruning ever eats the site itself.
          for f in index.html rmhd2d.html rmhd3d.html docs.html reading.html \
                   common.js physics.js solver2d.js style.css; do
            test -s "_site/webgpu/$f" || { echo "MISSING from staged site: $f"; exit 1; }
          done
          # Cache-bust the intra-site js/css references with the deploying commit, so a
          # browser holding a cached common.js can never pair it with newer HTML (the
          # "Can't find variable: controlsBuild" class of breakage, seen 2026-08-06).
          # The HTML itself is served with GH Pages' max-age=600, so within 10 minutes
          # of a deploy every client re-pairs atomically. Repo files stay unstamped.
          v="${GITHUB_SHA::8}"
          d="$(date -u +%F)"
          sed -i -e "s|src=\"common.js\"|src=\"common.js?v=$v\"|" \
                 -e "s|src=\"physics.js\"|src=\"physics.js?v=$v\"|" \
                 -e "s|src=\"solver2d.js\"|src=\"solver2d.js?v=$v\"|" \
                 -e "s|href=\"style.css\"|href=\"style.css?v=$v\"|" \
                 -e "s|<span class=\"buildid\">dev</span>|<span class=\"buildid\">$v ($d)</span>|" \
                 _site/webgpu/index.html _site/webgpu/rmhd2d.html _site/webgpu/rmhd3d.html
          grep -c "?v=$v" _site/webgpu/rmhd2d.html _site/webgpu/rmhd3d.html _site/webgpu/index.html
          grep -c "buildid\">$v" _site/webgpu/rmhd2d.html _site/webgpu/rmhd3d.html _site/webgpu/index.html
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=webgpu/">
          <title>taranis</title>
          <a href="webgpu/">webgpu demos</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
